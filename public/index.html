<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avalon AI 2.4 · Smart Budget</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#e7ecf5;background:#101826}*{box-sizing:border-box}body{max-width:850px;margin:0 auto;padding:20px}h1{margin-bottom:5px}small,.muted{color:#9caec5}.panel{background:#1c293b;border:1px solid #35475d;border-radius:14px;padding:17px;margin:13px 0}button,input,textarea{font:inherit}button{background:#416caa;color:white;border:0;border-radius:9px;padding:10px 14px;cursor:pointer;margin:3px}button:disabled{opacity:.4;cursor:not-allowed}button.secondary{background:#34465e}button.selected{background:#157d62}textarea{width:100%;min-height:72px;background:#101826;color:white;border:1px solid #455974;border-radius:8px;padding:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.seat{border:1px solid #526782;border-radius:10px;padding:12px;text-align:center;cursor:pointer}.seat.on{border-color:#64d9a9;background:#205847}.chat{max-height:300px;overflow:auto}.message{padding:7px;border-bottom:1px solid #35475d}.ok{color:#77deb4}.bad{color:#ffadad}#error{color:#ffaaaa}.review{border-color:#e6b566;background:#28364a}.chat{max-height:430px}.message.human{background:#243b54;border-radius:8px}.hint{font-size:.9rem;color:#afc7df}.panel{scroll-margin-top:12px}</style></head><body><h1>⚔ Avalon AI</h1><small>Fair Play Engine 2.4 · 七人局 · 你是 3 號</small><div class="panel" id="loginPanel"><input id="password" type="password" placeholder="管理密碼" autocomplete="current-password" style="padding:10px;border-radius:8px;background:#101826;color:white;border:1px solid #455974;max-width:180px"><button id="login">登入</button><button id="logout" class="secondary">登出</button></div><div class="panel"><button id="new">開始新局</button><button id="resume" class="secondary" style="display:none">繼續卡住的對局</button><button id="reset" class="secondary">放棄舊局並開始新局</button><span id="mode" class="muted"></span><p id="error" role="alert"></p></div><div id="app"></div><script>
let g=null,selected=[];const clearError=()=>{document.getElementById('error').textContent='';};const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,data){document.querySelectorAll('button').forEach(b=>b.disabled=true);try{const r=await fetch(url,{method:data?'POST':'GET',headers:{'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});const x=await r.json();if(!r.ok)throw Error(x.error||`HTTP ${r.status}`);clearError();return x;}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false);}}async function act(type,extra={}){try{document.getElementById('error').textContent='';g=await api('/api/action',{type,revision:g.revision,...extra});selected=[];render();if(type==='PROPOSE'&&g.pendingReplies)await replyPending();}catch(e){await refresh(true);document.getElementById('error').textContent=e.message;}}async function refresh(preserveError=false){const oldError=document.getElementById('error').textContent;try{g=await api('/api/state');if(preserveError)document.getElementById('error').textContent=oldError;else clearError();document.getElementById('loginPanel').style.display='none';render();}catch(e){if(e.message==='login required'){document.getElementById('loginPanel').style.display='block';app.innerHTML='<p>請先登入，才能讀取遊戲進度。</p>';}else document.getElementById('error').textContent=e.message;}}document.getElementById('login').onclick=async()=>{try{await api('/api/login',{password:document.getElementById('password').value});document.getElementById('password').value='';clearError();await refresh();}catch(e){document.getElementById('error').textContent=e.message;}};document.getElementById('logout').onclick=async()=>{await api('/api/logout',{});location.reload();};async function stepNext(){try{clearError();g=await api('/api/continue',{revision:g.revision});selected=[];render();if(g.pendingReplies)await replyPending();}catch(e){await refresh(true);document.getElementById('error').textContent=e.message;}}document.getElementById('new').onclick=async()=>{try{g=await api('/api/new',{});clearError();selected=[];render();}catch(e){document.getElementById('error').textContent=e.message;}};document.getElementById('resume').onclick=async()=>{try{g=await api('/api/resume',{revision:g.revision});clearError();selected=[];render();}catch(e){document.getElementById('error').textContent=e.message;}};document.getElementById('reset').onclick=async()=>{if(!window.confirm('確定放棄目前對局並開始新局？舊局將保留在資料庫，但不會再從網頁繼續。'))return;try{g=await api('/api/reset',{confirm:'RESET'});clearError();selected=[];render();}catch(e){document.getElementById('error').textContent=e.message;}};async function replyPending(){
 if(!g||!g.pendingReplies)return;
 const original=Number(g.pendingReplies)||0;
 for(let i=0;i<original;i++){
  try{g=await api('/api/respond',{revision:g.revision});render();}
  catch(e){await refresh(true);document.getElementById('error').textContent='NPC 回應失敗：'+e.message+'（已保存玩家發言與先前成功回應，稍後可重試）';return;}
 }
}
async function postHuman(){
 const value=document.getElementById('say')?.value;
 if(!value?.trim())return;
 try{g=await api('/api/speak',{revision:g.revision,text:value});render();}
 catch(e){await refresh(true);document.getElementById('error').textContent='玩家發言未送出：'+e.message;return;}
 await replyPending();
}
function render(){document.getElementById('resume').style.display=(g&&!g.noGame&&g.phase!=='ENDED')?'inline-block':'none';if(!g||g.noGame){app.innerHTML='<p>按「開始新局」建立遊戲。</p>';return;}document.getElementById('mode').textContent=(g.aiMode==='cloud'?'☁ 多模型 NPC':'⚙ 離線測試 NPC（非雲端 AI）')+(g.aiUsage?' · 本局呼叫 '+g.aiUsage.game+'/'+g.aiUsage.gameLimit+' · 每日上限 '+g.aiUsage.dailyLimit:'');const k=g.self;let html=`<div class="panel"><h3>你的身分：${esc(k.role)}</h3><div class="muted">${k.visibleEvil.length?'梅林可見邪惡座位：'+k.visibleEvil.join('、'):''} ${k.merlinCandidates.length?'梅林／莫甘娜候選：'+k.merlinCandidates.join('、'):''} ${k.evilTeammates.length?'邪惡同伴：'+k.evilTeammates.join('、'):''}</div><p>第 ${g.round} 輪 · 第 ${g.attempt} 次提案 · 隊長 ${g.captain} 號 · ${g.phase}</p><p>任務：${g.missions.map(m=>`<span class="${m.success?'ok':'bad'}">${m.round} ${m.success?'成功':'失敗'}（失敗牌 ${m.fails}）</span>`).join(' ｜ ')||'尚未執行'}</p></div>`;html+=g.budgetNotice?`<div class="panel"><p class="bad">${esc(g.budgetNotice)}</p></div>`:'';html+=`<div class="panel"><h3>規則與局勢提醒</h3><p class="hint">${g.rulesInfo?.fifthProposal?'⚠ 第五次提案：若遭否決，邪惡立即獲勝。':'本輪第 '+g.attempt+' 次提案；第五次否決將導致邪惡獲勝。'}</p>${g.rulesInfo?.previousVote?.unanimous?'<p class="hint">前次全票同意：代表三名邪惡玩家也投了同意，但無法證明隊伍中必定有壞人。</p>':''}<p class="hint">NPC 投票及任務牌採個別策略引擎，不耗用模型 API；模型額度保留給討論、提案及刺殺。</p></div>`;html+=`<div class="panel"><h3>NPC 模型配置</h3><div class="hint">${(g.npcRouting||[]).map(x=>`${x.seat} 號：${esc(x.provider)} / ${esc(x.model)} ${x.configured?'✓':'（缺少金鑰）'}`).join(' ｜ ')}</div></div>`;
html+=`<div class="panel"><h3>議事廳</h3><div class="chat">${g.publicMessages.slice(-30).map(m=>`<div class="message ${m.seat===3?'human':''}"><b>${m.seat} 號：</b>${esc(m.text)}</div>`).join('')||'尚無發言'}</div>`;if(g.phase!=='ENDED' && g.phase!=='ASSASSINATION')html+=`<div class="hint">公開議事廳持續開放。可指定「2號，為什麼...？」來質問 NPC；對話不會自動投票或結算。</div><textarea id="say" maxlength="1200" placeholder="向任何 NPC 提問、反駁或提出論點…"></textarea><button id="send">公開發言並聽取回應</button>`;if(g.pendingReplies)html+=`<p class="hint">尚有 ${g.pendingReplies} 名 NPC 等待回應。<button id="hearReplies" class="secondary">聽取 / 重試 NPC 回應</button></p>`;html+='</div>';if(g.review){const r=g.review;let summary='';if(r.kind==='VOTE'){summary=`同意 ${r.payload.yes} / 7，${r.payload.passed?'提案通過':'提案否決'}。<div class="hint">${Object.entries(r.payload.votes||{}).map(([n,v])=>`${n}號 ${v?'同意':'反對'}`).join('、')}</div>`;}else{summary=`第 ${r.payload.round} 輪任務${r.payload.success?'成功':'失敗'}，失敗牌 ${r.payload.fails} 張。`;}html+=`<div class="panel review"><h3>${r.kind==='VOTE'?'組隊投票結果':'任務結果揭曉'}</h3><p>${summary}</p><button id="continue">確認結果，進入下一階段</button></div>`;}if(!g.review&&g.phase==='DISCUSSION'&&g.captain!==3){html+=`<div class="panel"><h3>討論時間</h3><p class="hint">你可以先發言、質問任何 NPC。準備好後再請 ${g.captain} 號隊長正式提案。</p><button id="askProposal">請 ${g.captain} 號隊長提出隊伍</button></div>`;}if(!g.review&&g.phase==='DISCUSSION'&&g.captain===3){html+=`<div class="panel"><h3>選擇 ${g.missionSize} 名隊員</h3><div class="grid">${[1,2,3,4,5,6,7].map(s=>`<div class="seat ${selected.includes(s)?'on':''}" data-seat="${s}">${s} 號</div>`).join('')}</div><p>已選：${selected.join('、')||'無'}</p><button id="propose" ${selected.length!==g.missionSize?'disabled':''}>提出隊伍</button></div>`;}if(!g.review&&g.phase==='VOTING'){html+=`<div class="panel"><h3>隊伍：${g.team.join('、')}</h3><p>已秘密投票：${g.votesSubmitted.length}/7</p>${!g.votesSubmitted.includes(3)?'<button id="yes">同意</button><button id="no" class="secondary">反對</button>':'等待其他玩家投票'}</div>`;}if(!g.review&&g.phase==='MISSION'){html+=`<div class="panel"><h3>任務執行：${g.team.join('、')}</h3><p>已提交：${g.cardsSubmitted.length}/${g.team.length}</p>${g.team.includes(3)&&!g.cardsSubmitted.includes(3)?'<button id="success">成功牌</button>'+(['ASSASSIN','MORGANA','MORDRED'].includes(k.role)?'<button id="fail" class="secondary">失敗牌</button>':''):'等待任務結果'}</div>`;}if(g.phase==='ASSASSINATION'&&k.role==='ASSASSIN'){html+=`<div class="panel"><h3>刺殺梅林</h3>${[1,2,3,4,5,6,7].filter(s=>s!==3&&!k.evilTeammates.includes(s)).map(s=>`<button data-target="${s}">刺殺 ${s} 號</button>`).join('')}</div>`;}if(g.phase==='ENDED'){html+=`<div class="panel"><h2>遊戲結束：${g.winningTeam==='GOOD'?'正義勝利':'邪惡勝利'}</h2><p>真實身分：${Object.entries(g.roles).map(([s,r])=>`${s} 號 ${r}`).join('、')}</p><button id="audit">查看決策稽核</button><pre id="auditData" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></div>`;}html+=`<div class="panel"><h3>公開事件紀錄</h3><div class="chat">${g.events.slice(-30).map(e=>`<div class="message"><small>#${e.seq} ${esc(e.type)}</small> ${esc(JSON.stringify(e.payload))}</div>`).join('')}</div></div>`;app.innerHTML=html;document.getElementById('continue')?.addEventListener('click',stepNext);document.getElementById('askProposal')?.addEventListener('click',stepNext);document.getElementById('send')?.addEventListener('click',postHuman);document.getElementById('hearReplies')?.addEventListener('click',replyPending);document.querySelectorAll('[data-seat]').forEach(b=>b.onclick=()=>{const s=Number(b.dataset.seat);selected=selected.includes(s)?selected.filter(x=>x!==s):selected.length<g.missionSize?[...selected,s]:selected;render();});document.getElementById('propose')?.addEventListener('click',()=>act('PROPOSE',{team:selected}));document.getElementById('yes')?.addEventListener('click',()=>act('VOTE',{approve:true}));document.getElementById('no')?.addEventListener('click',()=>act('VOTE',{approve:false}));document.getElementById('success')?.addEventListener('click',()=>act('MISSION',{fail:false}));document.getElementById('fail')?.addEventListener('click',()=>act('MISSION',{fail:true}));document.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>act('ASSASSINATE',{target:Number(b.dataset.target)}));document.getElementById('audit')?.addEventListener('click',async()=>{document.getElementById('auditData').textContent=JSON.stringify(await api('/api/audit'),null,2);});}refresh();
</script></body></html>
