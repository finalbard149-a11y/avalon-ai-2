
name: Avalon AI 自動更新

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 取得 GitHub 程式碼
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 解壓縮更新包
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          zip_path = Path("avalon-ai-2.7-integrated.zip")
          if not zip_path.exists():
              raise SystemExit("找不到更新 ZIP")

          with zipfile.ZipFile(zip_path) as z:
              for item in z.infolist():
                  path = Path(item.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit("ZIP 含有不安全的路徑")
              z.extractall(".")
          PY

      - name: 安裝套件與測試
        run: |
          npm install
          npm test
          npm run check

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src public scripts test package.json UPGRADE-2.7*.md
          if git diff --cached --quiet; then
            echo "沒有需要更新的檔案"
          else
            git commit -m "Upgrade Avalon AI to 2.7"
            git push
          fi
